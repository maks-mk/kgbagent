[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slepp-ssh-mcp"
version = "0.3.1"
description = "A stdio MCP server that exposes Bash-like SSH execution, sessions, and remote file read/edit/search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pywinpty>=3.0.5,<4; platform_system == 'Windows'",
]
keywords = ["mcp", "ssh", "scp", "rsync", "tmux"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Networking",
    "Topic :: System :: Shells",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/slepp/ssh-mcp"
Repository = "https://github.com/slepp/ssh-mcp"
Issues = "https://github.com/slepp/ssh-mcp/issues"

[project.scripts]
ssh-mcp = "ssh_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["ssh_mcp*"]
